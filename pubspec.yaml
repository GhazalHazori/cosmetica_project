name: cosmetica_project
description: A production-ready, reusable Flutter starter template with Clean Architecture, theming, localization, and feature-first structure.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.0.10+1

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Video player
  video_player: 

  # Networking
  dio: ^5.7.0

  # Functional error handling
  dartz: ^0.10.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Storage (optional, ready for future use)
  shared_preferences: ^2.3.5
  lottie: ^3.3.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/l10n/ar.json
    - lib/l10n/en.json
    - assets/video/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
